<html xmlns:fb="http://ogp.me/ns/fb#">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf8" />
<meta name="twitter:widgets:csp" content="on">
<title>Looper for YouTube</title>
<link rel="stylesheet" type="text/css" media="all" href="options.css" />
</head>
<body class="embedded">
	<div id="main_content">
		<header>
			<h1><span id="extension_name">Looper for YouTube</span></h1>
		</header>
		<section>
		<div>
			<p id="text_welcome_translation">Welcome translations from your language!</p>
		</div>
		</section>
		<section>
		<div>
			<div>
				<div class="radiobox"><label><input type="radio" id="option_loop_manual" name="option_loop" value="false" /><span>Loop every video manually</span></label></div>
				<div class="radiobox"><label><input type="radio" id="option_loop_savestate" name="option_loop" value="saveState" /><span>Automatically loop videos according to previous state</span></label></div>
				<div class="radiobox"><label><input type="radio" id="option_loop_auto" name="option_loop" value="true" /><span>Automatically loop every video</span></label></div>
			</div>
			<div>
				<div class="selectbox"><label><span>Loop button show</span> <select id="option_button"><option id="option_button_iconandtext" value="all">icon and text</option><option id="option_button_icon" value="icon">icon only</option><option id="option_button_text" value="text">text only</option></select></label></div>
				<div class="checkbox"><label><input type="checkbox" id="ytShortcut" /><span>Enable keyboard shortcut for switching looping on/off</span></label></div>
				<div class="checkbox" id="ytShortcutKey_group"><label><span>Keyboard shortcut key: </span><input type="text" id="ytShortcutKey" maxlength="1" size="2" style="width:2em;text-align:center;font-family:monospace" placeholder="p" /></label></div>
				<div class="checkbox"><label><input type="checkbox" id="ytLoopPanel" /><span>Advanced loop options</span></label></div>
			</div>
			<div id="extra_features">
				<h4 id="title_extra_features">Extra Features</h4>
				<div class="selectbox"><label><span>Auto-set video quality to</span> <select id="ytQuality"><option id="option_disabled" value="disabled">---</option><option id="option_auto" value="default">Auto</option><option value="highres">8K</option><option value="hd2880">5K</option><option value="hd2160">4K</option><option value="hd1440">1440p</option><option value="hd1080">1080p</option><option value="hd720">720p</option><option value="large">480p</option><option value="medium">360p</option><option value="small">240p</option><option value="tiny">144p</option></select></label></div>
			</div>
			<div id="message_text">&nbsp;</div>
			<p>** <span id="text_not_compatible">Not compatible with other extensions for YouTube that have similar functions.</span></p>
</div>
		</section>
		<footer>
			<p>
				&copy;&nbsp;<span id="text_extension_by">Looper for YouTube by </span>AlvinHKH
				<label id="versionGroup">- <span id="text_version">Version</span>&nbsp;<span id="version"></span></label>
			</p>
		</footer>
	</div>
<script type="text/javascript" src="options.js"></script>
</body>
</html>
